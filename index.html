<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champ's Quest Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Lexend:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="css-v1">
:root {
  /* Layout: a game HUD on top, three tabs below. Today = quest checklist beside the time-plan timeline; stacks on phones. */
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #f4f6f9;
  --ink: #131a26;
  --muted: #5b6577;
  --line: #dce1e9;
  --xp: #d99a00;
  --good: #0f855e;
  --warn: #a86400;
  --bad: #c2372c;
  --tomato: #e5484d;
  --leaf: #2f9e44;
  --t-github: #2a62de;
  --t-job: #0b876a;
  --t-content: #cc2f68;
  --t-personality: #df550c;
  --t-live: #976f00;
  --t-research: #6b44df;
  --t-fixed: #7a8497;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1219; --surface: #151c26; --surface-2: #1b2430; --ink: #e7ecf4; --muted: #9ba7b9; --line: #283344;
    --xp: #f2b630; --good: #3cc58f; --warn: #e3a23b; --bad: #f07167; --tomato: #ff6b6b; --leaf: #51cf66;
    --t-github: #7aa2ff; --t-job: #3cc79d; --t-content: #ff6fa0; --t-personality: #ff8f52; --t-live: #e0b63e; --t-research: #a98cff; --t-fixed: #8f9bb0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1219; --surface: #151c26; --surface-2: #1b2430; --ink: #e7ecf4; --muted: #9ba7b9; --line: #283344;
  --xp: #f2b630; --good: #3cc58f; --warn: #e3a23b; --bad: #f07167; --tomato: #ff6b6b; --leaf: #51cf66;
  --t-github: #7aa2ff; --t-job: #3cc79d; --t-content: #ff6fa0; --t-personality: #ff8f52; --t-live: #e0b63e; --t-research: #a98cff; --t-fixed: #8f9bb0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h2 { font-size: 1.12rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h3 .muted { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-weight: 500; }
.muted { color: var(--muted); font-size: .86rem; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 1140px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 14px; }

/* header + HUD */
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -.02em; line-height: 1; }
.brand-sub { color: var(--muted); font-size: .82rem; margin-top: 4px; }
.hud { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; min-width: 0; }
.lv { width: 48px; height: 48px; border-radius: 12px; background: var(--ink); color: var(--surface); display: grid; place-items: center; align-content: center; flex: none; }
.lv-num { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1; font-variant-numeric: tabular-nums; }
.lv-cap { font-size: .6rem; letter-spacing: .14em; font-weight: 700; opacity: .7; }
.xpbox { flex: 1; min-width: 0; }
.xp-top { display: flex; justify-content: space-between; gap: 10px; font-size: .84rem; margin-bottom: 6px; }
.lv-title { font-weight: 700; }
.xp-num { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.xpbar { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.xpbar span { display: block; height: 100%; background: var(--xp); border-radius: 99px; transition: width .4s ease; }
.streak { display: flex; align-items: center; gap: 6px; color: var(--muted); flex: none; }
.streak svg { width: 22px; height: 22px; }
.streak.lit { color: var(--t-personality); }
.streak-num { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.streak-cap { font-size: .76rem; color: var(--muted); max-width: 4.5em; line-height: 1.1; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 0; font-size: 1.3rem; line-height: 1; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { background: var(--surface-2); }

/* tabs */
.tabs { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 18px -14px rgba(0,0,0,.35); }
.tabs button { border: 0; background: transparent; padding: 9px 10px; border-radius: 9px; font-weight: 600; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--ink); color: var(--surface); }

/* generic */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card + .card { margin-top: 0; }
#view { display: grid; gap: 14px; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head .pill { margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 11px; font-size: .86rem; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.toggle.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; }
.link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 2px 4px; font-size: .84rem; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: .88rem; margin-top: 10px; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); }
.notice.warn svg { color: var(--warn); }
.logline { font-size: .86rem; color: var(--muted); }

/* pills */
.pill { display: inline-flex; align-items: center; height: 21px; padding: 0 8px; border-radius: 99px; font-size: .72rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap; vertical-align: middle; font-family: var(--font-body); }
.pill-done { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill-track { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill-behind, .pill-missed { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.pill-muted { background: var(--surface-2); color: var(--muted); }

/* day header */
.dayhead { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.daynav { display: flex; align-items: center; gap: 8px; }
.dname { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; letter-spacing: -.02em; }
.ddate { color: var(--muted); font-size: .88rem; margin-top: 3px; }
.daytitle { min-width: 9.5em; }
.dayscore { display: flex; align-items: center; gap: 10px; }
.ds-pct { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ds-cap { color: var(--muted); font-size: .8rem; margin-top: 3px; }
.dayactions { display: flex; gap: 8px; flex-wrap: wrap; }

/* now / next */
.nownext { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nownext > div { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--line)); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.nn-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.nn-title { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.nn-time { font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }

.today-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: 14px; align-items: start; }

/* rows */
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
h3 + .row, .card-head + .row { border-top: 0; }
.row-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); display: inline-block; }
.row > .row-dot { align-self: start; margin-top: 7px; }
.row-title { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.row-hint { color: var(--muted); font-size: .84rem; margin-top: 2px; }
.row-hint strong { color: var(--ink); }
.row-hint .when { color: var(--ink); font-weight: 600; }
.row-ctrl { display: flex; align-items: center; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.count { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); min-width: 3.2ch; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal-n { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); font-weight: 500; border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.row.is-done .row-title { color: var(--muted); }
.row.is-done .row-title::before { content: ""; width: 14px; height: 8px; border-left: 2.5px solid var(--good); border-bottom: 2.5px solid var(--good); transform: rotate(-45deg) translateY(-2px); margin-right: 2px; }
.row.is-dim { opacity: .45; }

.pips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
.pip { width: 26px; height: 26px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--tc) 55%, var(--line)); background: transparent; cursor: pointer; padding: 0; transition: transform .12s ease, background .12s ease; }
.pip:hover:not(:disabled) { transform: scale(1.08); }
.pip.on { background: var(--tc); border-color: var(--tc); }
.pip.stretch { border-style: dashed; }
.pip:disabled { cursor: default; opacity: .6; }
.is-pomo .pip { border: 0; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.is-pomo .pip svg { width: 26px; height: 26px; }
.is-pomo .pip .fruit { fill: transparent; stroke: color-mix(in srgb, var(--tomato) 55%, var(--line)); stroke-width: 1.6; }
.is-pomo .pip .leaf { fill: color-mix(in srgb, var(--leaf) 45%, var(--line)); }
.is-pomo .pip.on { background: transparent; }
.is-pomo .pip.on .fruit { fill: var(--tomato); stroke: var(--tomato); }
.is-pomo .pip.on .leaf { fill: var(--leaf); }
.check { width: 32px; height: 32px; border-radius: 9px; border: 2px solid color-mix(in srgb, var(--tc) 55%, var(--line)); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; }
.check svg { width: 20px; height: 20px; }
.check.on { background: var(--tc); border-color: var(--tc); color: #fff; }
.check.sm { width: 26px; height: 26px; border-radius: 7px; --tc: var(--t-personality); }
.check.sm svg { width: 16px; height: 16px; }
.check:disabled { opacity: .55; cursor: default; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 34px; height: 32px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 1.1rem; font-weight: 700; }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper .num { min-width: 3.4ch; text-align: center; font-family: var(--font-mono); font-size: .86rem; padding: 0 6px; font-variant-numeric: tabular-nums; }
.hbar { position: relative; width: 140px; height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: visible; }
.hbar span { display: block; height: 100%; border-radius: 99px; background: var(--tc, var(--ink)); }
.hbar i { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; }
.hbar.wide { width: 100%; max-width: 360px; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; }
.chip.on { background: color-mix(in srgb, var(--tc, var(--ink)) 15%, var(--surface)); border-color: var(--tc, var(--ink)); color: var(--ink); font-weight: 600; }
.chip:disabled { opacity: .55; cursor: default; }

/* timeline */
.plan-sum { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.plan-sum span { font-size: .82rem; color: var(--muted); border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 8px; padding: 4px 10px; }
.plan-sum b { color: var(--ink); font-family: var(--font-mono); font-weight: 600; }
.timeline { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.tl { display: grid; grid-template-columns: 46px 5px minmax(0, 1fr) auto; gap: 10px; align-items: stretch; padding: 7px 8px; border-radius: 10px; }
.tl-time { font-family: var(--font-mono); font-size: .76rem; display: grid; align-content: start; font-variant-numeric: tabular-nums; }
.tl-end { color: var(--muted); }
.tl-bar { border-radius: 4px; background: var(--tc); min-height: 32px; }
.tl-title { font-weight: 650; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tl-sub { color: var(--muted); font-size: .8rem; margin-top: 1px; }
.tl-dur { font-family: var(--font-mono); font-size: .74rem; color: var(--muted); white-space: nowrap; }
.tl.type-free .tl-bar { background: transparent; border: 1.5px dashed var(--line); }
.tl.type-free .tl-title { color: var(--muted); font-weight: 500; }
.tl.type-fixed .tl-bar { background: repeating-linear-gradient(135deg, var(--tc) 0 5px, color-mix(in srgb, var(--tc) 45%, transparent) 5px 9px); }
.tl.type-job { background: color-mix(in srgb, var(--t-job) 9%, var(--surface)); }
.tl.type-wind { background: color-mix(in srgb, var(--t-live) 8%, var(--surface)); }
.tl.is-now { outline: 2px solid var(--ink); outline-offset: -2px; }
.tl.is-done .tl-title, .tl.is-done .tl-sub { opacity: .55; }
.now-pill, .done-pill { font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 5px; padding: 1px 6px; }
.now-pill { background: var(--ink); color: var(--surface); }
.done-pill { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }

/* quests tab */
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 4px; }
.wday { display: grid; justify-items: center; gap: 3px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 2px; cursor: pointer; }
.wday.today { border-color: var(--ink); }
.wday.sel { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--ink); }
.wd-name { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.wd-pct { font-family: var(--font-mono); font-size: .7rem; color: var(--muted); }
.sublist { list-style: none; margin: 0 0 6px 22px; padding: 0; display: grid; gap: 6px; }
.sublist li { display: flex; align-items: center; gap: 8px; font-size: .88rem; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; max-width: 420px; }
.slot { border: 1.5px dashed var(--line); border-radius: 9px; padding: 5px 6px; display: grid; gap: 1px; min-width: 0; }
.slot.planned { border-style: solid; border-color: color-mix(in srgb, var(--t-personality) 55%, var(--line)); }
.slot.on { border-style: solid; border-color: var(--t-personality); background: color-mix(in srgb, var(--t-personality) 12%, var(--surface)); }
.slot-m { font-size: .7rem; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.slot-t { font-size: .76rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* progress tab */
.statrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stat-k { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.stat-v { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.01em; margin: 2px 0; }
.stat-s { color: var(--muted); font-size: .84rem; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.filters .chips { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--surface); }
.taggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.tagcard { border-top: 4px solid var(--tc); display: grid; gap: 8px; }
.tc-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.tc-name { font-weight: 700; }
.tc-pct { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tagcard .hbar { width: 100%; }
.heat { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; }
.heat i { display: block; aspect-ratio: 1; border-radius: 2px; background: var(--tc); }
.tc-cap { font-size: .72rem; color: var(--muted); }
.tablewrap { overflow-x: auto; margin-top: 10px; }
.gtable { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 560px; }
.gtable th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.gtable td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.gtable td:first-child { font-weight: 600; }
.gtable td .row-dot { margin-right: 8px; }
.gtable .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ghgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
.ghitem { display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-left: 4px solid var(--tc); border-radius: 9px; padding: 8px 10px; font-size: .88rem; font-weight: 600; }
.ghitem.stale { border-left-color: var(--line); }
.ghitem .muted { font-weight: 500; white-space: nowrap; }
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 20px; margin: 10px 0 0; padding: 0; list-style: none; font-size: .88rem; }
.rules b { font-family: var(--font-mono); font-weight: 600; }

/* footer */
.foot { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: space-between; align-items: center; font-size: .82rem; color: var(--muted); padding-top: 4px; }
.sync { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); display: inline-block; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 20, .45); display: grid; place-items: center; padding: 16px; }
.modal[hidden] { display: none; }

<script>
'use strict';
/* ================= Quest Board: pure logic (dates, catalog, plan, XP) ================= */

const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseK = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = parseK(k); d.setDate(d.getDate() + n); return dkey(d); };
const dow = k => parseK(k).getDay(); // 0 Sun .. 6 Sat
const diffDays = (a, b) => Math.round((parseK(b) - parseK(a)) / 864e5);
const weekStart = k => addDays(k, -((dow(k) + 6) % 7)); // Monday
const weekEnd = k => addDays(weekStart(k), 6);
const monthRange = k => {
  const [y, m] = k.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(last)}`];
};
const lastDowOfMonth = (mk, wd) => { let k = monthRange(mk + '-01')[1]; while (dow(k) !== wd) k = addDays(k, -1); return k; };
const nthSunday = k => Math.ceil(Number(k.slice(8)) / 7);
const fmtT = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const parseT = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtDay = k => { const d = parseK(k); return `${DOW_SHORT[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };

/* A night-owl day: 11:00 -> 03:00 belongs to one date. Times before the midpoint
   between sleep and wake (07:00 by default) still count as the previous day. */
function logicalNow(S, now = new Date()) {
  const clock = now.getHours() * 60 + now.getMinutes();
  const crosses = S.dayEnd > 1440;
  const boundary = crosses ? Math.round(((S.dayEnd - 1440) + S.dayStart) / 2) : 0;
  if (crosses && clock < boundary) {
    const d = new Date(now); d.setDate(d.getDate() - 1);
    return { k: dkey(d), m: clock + 1440 };
  }
  return { k: dkey(now), m: clock };
}

/* ---------------- Catalog: every one of the 23 goals ---------------- */
const TAGS = {
  github: 'GitHub', job: 'Job', content: 'Content', personality: 'Personality', live: 'To live', research: 'Research'
};
const TAG_ORDER = ['github', 'job', 'content', 'personality', 'live', 'research'];

const ITEMS = {
  // daily, all 7 days
  gh:      { n: [3],  freq: 'daily', tag: 'github', kind: 'pomo', target: 3, xp: 10, label: 'GitHub', hint: '3 Pomodoros (2 h). Pick from the GitHub menu below.' },
  det:     { n: [17], freq: 'daily', tag: 'job', kind: 'pips', target: 3, xp: 10, label: 'Detailed applications', hint: 'Custom CV, short cover note, LinkedIn message, referral ask' },
  quick:   { n: [17], freq: 'daily', tag: 'job', kind: 'pips', target: 7, stretch: 8, xp: 3, label: 'Quick applications', hint: 'Wellfound, Welcome to the Jungle, LinkedIn' },
  rec:     { n: [17], freq: 'daily', tag: 'job', kind: 'pips', target: 2, stretch: 3, xp: 4, label: 'Recruiters from posts', hint: 'Message recruiters who listed roles in their posts' },
  cmt:     { n: [16], freq: 'daily', tag: 'job', kind: 'pips', target: 5, xp: 2, label: 'LinkedIn comments', hint: 'A question, point or experience on posts by target-company leaders, HMs, founders' },
  msg:     { n: [16], freq: 'daily', tag: 'job', kind: 'pips', target: 5, xp: 2, label: 'LinkedIn messages', hint: 'Alumni, colleagues, people from events, target-role people, leaders, HMs' },
  chat:    { n: [21], freq: 'daily', tag: 'job', kind: 'check', target: 1, xp: 15, label: 'Talk to one person', hint: 'Coffee chat (about 1 h): mentor, founder, alumni, senior, prof, target-company person' },
  speak:   { n: [8],  freq: 'daily', tag: 'personality', kind: 'check', target: 1, xp: 5, label: '1-minute impromptu talk', hint: '' },
  write:   { n: [9],  freq: 'daily', tag: 'live', kind: 'check', target: 1, xp: 5, label: '5 minutes of peaceful writing', hint: 'Anything at all. No phone, no distractions.' },
  track:   { n: [22], freq: 'daily', tag: 'live', kind: 'check', target: 1, xp: 5, label: 'Track the day', hint: '10 minutes: update every count, then tick this' },
  // weekly (Mon to Sun)
  meher:     { n: [1],  freq: 'weekly', tag: 'github', kind: 'pomo', target: 6, xp: 10, label: 'Meher startup work', hint: '4 h a week = 6 Pomodoros' },
  meherMeet: { n: [1],  freq: 'weekly', tag: 'github', kind: 'check', target: 1, xp: 20, label: 'Meher meeting', hint: 'Saturdays, 2 h' },
  shift:     { n: [2],  freq: 'weekly', tag: 'personality', kind: 'hours', target: 6, stretch: 8, xp: 5, label: 'Part-time shift', hint: '6–8 h a week plus 1–2 h rest. Add shifts on the Today tab.' },
  reel:      { n: [6],  freq: 'weekly', tag: 'content', kind: 'pips', target: 3, xp: 40, label: 'Instagram reels', hint: 'Up to 10–12 h a week' },

/* ---------------- Scores, XP, levels, streaks ---------------- */

}

    xp += Math.min((d.free || []).length, 5) * ITEMS.free.xp;
    if (dow(k) === 0) {
      if (nthSunday(k) <= 4) xp += Math.min(c.chores || 0, 1) * ITEMS.chores.xp;

    const mk = k.slice(0, 7), m = months[mk] || (months[mk] = {});
    for (const id of [...MONTHLY_IDS, 'convo', 'research', 'rtalk']) m[id] = (m[id] || 0) + (c[id] || 0);
    const cy = cycleRange(S, k)[0];
    cycles[cy] = (cycles[cy] || 0) + (c.targets || 0);

  for (const ws in weeks) {
    let all = true;
    for (const id of WEEKLY_IDS) {
      const v = weeks[ws][id] || 0;

      if (v < tgt(S, id)) all = false;

    if (all) xp += 100;

    const m = months[mk];

    xp += Math.min(m.research, 30) * ITEMS.research.xp + Math.min(m.rtalk, 10) * ITEMS.rtalk.xp;

  // which quests live inside which block of the day
  function blockCfg(b, k) {
    switch (b.id) {
      case 'gh': return { main: 'gh' };
      case 'job': return { items: ['det', 'quick', 'rec', 'cmt', 'msg', 'grad', 'vc'] };
      case 'chat': return { main: 'chat' };
      case 'campus': return { items: ['chat'] };
      case 'wind': return { items: ['speak', 'write', 'track', ...(dow(k) === 0 && nthSunday(k) > 4 ? ['ebike'] : [])] };
      case 'chores': return { main: 'chores', items: ['ebike'] };
      case 'event': return { main: 'event', items: ['convo'] };
      case 'shift': return { main: 'shift' };
      case 'reel': case 'liPost': case 'meher': case 'meherMeet': case 'research': case 'targets': case 'content': case 'calendar': case 'claude': return { main: b.id };
      default: return {};

  function slot2(b, k, plan, nowM, ctx) {
    const live = k === todayK(), isNow = live && nowM >= b.s && nowM < b.e, len = b.e - b.s;
    const time = `<div class="slot-time"><b>${fmtT(b.s)}</b><span>${fmtT(b.e)}</span></div>`;
    if (b.type === 'free') {

    const items = (cfg.items || []).filter(id => !ctx.done.has(id));
    items.forEach(id => ctx.done.add(id));
    let sub = b.sub || '';
    if (b.id === 'job') sub = 'Hit these counts anywhere in this window.' + (plan.campus ? ' The campus gaps count too.' : '');
    if (b.id === 'shift') sub = `${fmtDur(len)}, then an hour's rest`;
    if (main && main.hint && !['gh', 'chat', 'targets', 'content', 'calendar', 'claude', 'event'].includes(cfg.main)) sub = (sub ? sub + ' · ' : '') + main.hint;
    if (main && ['targets', 'content', 'calendar', 'claude', 'event'].includes(cfg.main)) sub = ITEMS[cfg.main].hint;
    const meta = `<div class="slot-meta"><span class="cat">${CAT2[b.id] || ''}</span>${tagChip(b.tag)}${main ? goalN(main.n) : ''}<span class="dur">${fmtDur(len)}</span>${isNow ? '<span class="nowtag">Now</span>' : ''}${done ? '<span class="donetag">Done</span>' : ''}</div>`;
    const title = main && cfg.main === 'event' ? main.label : b.title;
    let body = `<div class="slot-row"><div class="slot-txt"><div class="slot-title">${esc(title)}</div>${sub ? `<div class="slot-sub">${sub}</div>` : ''}</div>${main ? `<div class="slot-ctrl">${main.ctrl}${main.count != null ? `<span class="count">${main.count}</span>` : ''}</div>` : ''}</div>`;
    if (b.id === 'gh') body += ghMenu2(k);
    if (items.length) body += `<div class="items">${items.map(id => itemLine(id, k, ctx.light)).join('')}</div>`;
    if (ctx.chipsAt === b) body += recharge2(k);
    const dim = ctx.light && main && !LIGHT_IDS.includes(cfg.main) && !main.done;
    return `<li class="slot${isNow ? ' is-now' : ''}">${time}<div class="scard type-${b.type}${done ? ' is-done' : ''}${dim ? ' is-dim' : ''}" ${tagStyle(b.tag)}${cfg.main ? ` data-item="${cfg.main}"` : ''}>${meta}${body}</div></li>`;
  }
  function streakWeek(k) {

  }
  const knownMonths = new Set();
  function dirtyMonths() { return [...knownMonths].map(mk => 'm-' + mk); }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    if (b.closest('#modal') && b.type === 'submit') return;
    e.preventDefault();
    handle(b.dataset.act, b.dataset, b);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  /* ---------- render ---------- */
  /* ---------- shells & render ---------- */
  const GEAR = '<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M11.3 1.5l.4 2.1c.6.2 1.1.5 1.6.9l2-.8 1.3 2.3-1.6 1.4c.1.6.1 1.2 0 1.8l1.6 1.4-1.3 2.3-2-.8c-.5.4-1 .7-1.6.9l-.4 2.1H8.7l-.4-2.1c-.6-.2-1.1-.5-1.6-.9l-2 .8-1.3-2.3L5 9.2a5 5 0 0 1 0-1.8L3.4 6l1.3-2.3 2 .8c.5-.4 1-.7 1.6-.9l.4-2.1h2.6zM10 6.1a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4z" transform="translate(0 1)"/></svg>';
  const VSWITCH = '<div class="vswitch" role="group" aria-label="Look"><button type="button" data-act="ver" data-v="1">V1</button><button type="button" data-act="ver" data-v="2">V2</button></div>';
  const LEGEND = '<span style="--tc:var(--t-github)"><i></i>GitHub</span><span style="--tc:var(--t-job)"><i></i>Job</span><span style="--tc:var(--t-content)"><i></i>Content</span><span style="--tc:var(--t-personality)"><i></i>Personality</span><span style="--tc:var(--t-live)"><i></i>To live</span><span style="--tc:var(--t-research)"><i></i>Research</span><span style="--tc:var(--t-fixed)"><i></i>Fixed</span>';
  const SHELL_V1 = `<header class="top">
    <div class="brand"><div class="brand-name">Quest Board</div><div class="brand-sub">Champ · all 23 goals in one place</div></div>
    <div class="hud" id="hud"></div>
    <div class="tools"><span id="authslot"></span>${VSWITCH}<button type="button" class="icon-btn" data-act="settings" aria-label="Settings">${GEAR}</button></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Views"><button type="button" role="tab" data-act="tab" data-v="today">Today</button><button type="button" role="tab" data-act="tab" data-v="quests">Quests</button><button type="button" role="tab" data-act="tab" data-v="progress">Progress</button></nav>
  <main id="view" data-tab="today"></main>
  <footer class="foot"><div id="sync" class="sync" role="status"></div><div class="legend" aria-label="Tag colours">${LEGEND}</div></footer>`;
  let mounted = 0;
  let LOCAL_UI = null;
  try { LOCAL_UI = JSON.parse(localStorage.getItem(LS_KEY + '-ui') || 'null'); } catch (e) { }
  const uiPref = () => Object.assign({ version: 2, theme: 'light' }, BACKEND.uiLocal ? (LOCAL_UI || {}) : (S().ui || {}));
  function mountShell(v) {
    const app = $('#app');
    app.className = v === 1 ? 'app' : 'app2';
    app.innerHTML = v === 1 ? SHELL_V1 : shellV2();
    const c1 = document.getElementById('css-v1'), c2 = document.getElementById('css-v2');
    if (c1) c1.disabled = v !== 1;
    if (c2) c2.disabled = v !== 2;
    mounted = v;
  }
  function render() {
    for (const k in ST.days) knownMonths.add(k.slice(0, 7));
    const ae = document.activeElement, key = ae && ae.dataset && ae.dataset.act ? `[data-act="${ae.dataset.act}"]${ae.dataset.id ? `[data-id="${CSS.escape(ae.dataset.id)}"]` : ''}${ae.dataset.v ? `[data-v="${ae.dataset.v}"]` : ''}${ae.dataset.d ? `[data-d="${ae.dataset.d}"]` : ''}${ae.dataset.day ? `[data-day="${ae.dataset.day}"]` : ''}` : null;
    if (!VIEW.day) VIEW.day = todayK();
    const ui = uiPref(), v = ui.version === 1 ? 1 : 2;
    if (mounted !== v) mountShell(v);
    document.documentElement.classList.toggle('v2-dark', v === 2 && ui.theme === 'dark');
    document.querySelectorAll('[data-act="ver"]').forEach(b => { const on = Number(b.dataset.v) === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const tb = $('#theme-btn');
    if (tb) { tb.innerHTML = ui.theme === 'dark' ? I.sun : I.moon; tb.setAttribute('aria-label', ui.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'); }
    const slot = $('#authslot'); if (slot) slot.innerHTML = BACKEND.toolsHTML();
    document.body.classList.toggle('readonly', !BACKEND.canWrite());
    if (v === 1) renderHUD(); else renderHUD2();
    document.querySelectorAll('.tabs button').forEach(b => { const on = b.dataset.v === VIEW.tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    $('#view').dataset.tab = VIEW.tab;
    if (v === 1) { if (VIEW.tab === 'quests') renderQuests(); else if (VIEW.tab === 'progress') renderProgress(); else renderToday(); }
    else { if (VIEW.tab === 'quests') renderQuests2(); else if (VIEW.tab === 'progress') renderProgress2(); else renderToday2(); }
    $('#sync').innerHTML = syncHTML();
    if (key) { const el = document.querySelector('#app ' + key); if (el) el.focus({ preventScroll: true }); }
  }
  function fromHash() { const h = (location.hash || '').slice(1); VIEW.tab = ['today', 'quests', 'progress'].includes(h) ? h : 'today'; }
  window.addEventListener('hashchange', () => { fromHash(); render(); });
  fromHash();
  render();
  // keep "now" fresh and roll over to the new day after the boundary
  let lastToday = todayK();
  setInterval(() => { const t = todayK(); if (t !== lastToday) { if (VIEW.day === lastToday) VIEW.day = t; lastToday = t; } if (VIEW.tab === 'today' && $('#modal').hidden) render(); }, 60000);
  connect();
})();

</script>
</body>
</html>
